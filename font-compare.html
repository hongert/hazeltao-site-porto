<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>中文字体对比</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSans-Regular.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSans-Medium.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chinese-fonts/maple-mono-cn@2.0.0/dist/MapleMono-CN-Regular/result.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkaimono-regular.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans-sc-webfont-splitted@1.1.0/dist/Regular.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-lxgw-neo-xi-hei-regular@1.0.1/font.css">
<style>
body{margin:0;padding:20px;background:#fff;color:#111}
.ref{background:#f2f2f2;border-radius:14px;padding:18px 20px;margin-bottom:16px;font-family:"DM Mono",'Courier New'}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}.m{gap:20px;flex-wrap:wrap}}
.c{background:#f2f2f2;border-radius:14px;padding:18px 20px}
.n{font:12px/1 "DM Mono",monospace;color:#999;margin-bottom:14px}
h1{font-size:34px;font-weight:400;margin:0 0 4px}
.s{font-size:18px;color:#8a8a8a;margin-bottom:14px}
.l{font-size:11px;color:#8a8a8a;margin-bottom:6px}
p{font-size:13px;line-height:1.75;margin:0 0 12px}
.m{display:flex;gap:40px;font-size:13px}
</style></head><body>
<div class="ref"><div class="n">现在的英文字体（EN 界面）· DM Mono</div><h1>TAOHE</h1><div class="s">Brand Identity</div><p>TAOHE is a brand proposal built from the ground up, rooted in the heritage of my family’s business. 100% yak wool apparel.</p><div class="m"><div><div class="l">Year</div>2026</div><div><div class="l">Deliverables</div>Brand Strategy</div><div><div class="l">Credits</div>Photography: Kin Codel</div></div></div>
<div class="grid" id="g"></div>
<script>
const fonts=[['A · Noto Sans SC 思源黑体',"'Noto Sans SC'"],['B · MiSans（现在用的）',"MiSans"],['C · HarmonyOS Sans SC 鸿蒙黑体',"'HarmonyOS Sans SC'"],['D · LXGW Neo XiHei 霞鹜新晰黑',"'LXGW Neo XiHei'"],['E · Maple Mono CN（等宽英文 + 圆润黑体）',"'Maple Mono CN'"],['F · LXGW WenKai Mono 霞鹜文楷等宽（等宽英文 + 楷体）',"'LXGW WenKai Mono'"]];
const txt="植物园品牌重塑提案关于项目年份交付内容署名摄影洛杉矶全部项目星期三月日TAOHEIdentitySystemRebrandProposalKinCodel0123456789是一个从零开始打造的根植于我家族生意传承最终形成以牦牛绒服饰为核心商业模式字体处理灵感来自西藏山脉粗犷自然起伏品牌形象设计策略";
document.body.style.visibility='hidden';
document.getElementById('g').innerHTML=fonts.map(([n,f])=>`<div class="c" style="font-family:${f},'Courier New'"><div class="n">${n}</div><h1>TAOHE</h1><div class="s">品牌形象设计</div><div class="l">关于项目</div><p>TAOHE 是一个从零开始打造的品牌提案，根植于我家族生意的传承。项目最终形成以 100% 牦牛绒服饰为核心的商业模式。字体处理的灵感来自西藏山脉粗犷、自然的起伏。</p><div class="m"><div><div class="l">年份</div>2026</div><div><div class="l">交付内容</div>品牌策略<br>Identity System</div><div><div class="l">署名</div>摄影：Kin Codel</div></div><p style="margin-top:12px">10月14日星期三　洛杉矶, 14:35:45　·　全部项目　EN / CN</p></div>`).join('');
Promise.all(fonts.map(([n,f])=>document.fonts.load("400 16px "+f,txt)).concat([document.fonts.load('400 16px "DM Mono"','TAOHE abc 0123')])).then(()=>{document.body.style.visibility='visible'});
</script></body></html>
