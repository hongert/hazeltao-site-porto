	<script>
		// 黑/白背景跟着访客本地时间：晚上 7 点到凌晨 5 点是黑色，其余时间白色
		// 手动点开关只在当前这一段时间内有效，到下一个 7 点 / 5 点就恢复自动
		(function () {
			function auto() { var h = new Date().getHours(); return h >= 19 || h < 5 ? 'dark' : 'light'; }
			function nextSwitch() {
				var n = new Date(), h = n.getHours();
				if (h >= 19) n.setDate(n.getDate() + 1);
				n.setHours(h >= 5 && h < 19 ? 19 : 5, 0, 0, 0);
				return n.getTime();
			}
			function pick() {
				var t = auto();
				try { var o = JSON.parse(localStorage.getItem('themeOverride')); if (o && o.until > Date.now()) t = o.theme; } catch (e) {}
				document.documentElement.dataset.theme = t;
			}
			window.siteTheme = { pick: pick, nextSwitch: nextSwitch };
			try { localStorage.removeItem('theme'); } catch (e) {}
			pick();
			setInterval(pick, 60000);
			document.addEventListener('visibilitychange', function () { if (!document.hidden) pick(); });
		})();
	</script>

<button class="intro-replay" id="replay">再播一次 ↻</button>
<script>
(function () {
	const el = document.getElementById('intro');
	let t;
	function play() {
		el.querySelectorAll('.half').forEach((h) => (h.style.transition = 'none'));
		el.classList.remove('open', 'show'); el.style.display = 'block';
		void el.offsetWidth; el.querySelectorAll('.half').forEach((h) => (h.style.transition = ''));
		requestAnimationFrame(() => el.classList.add('show'));
		t = setTimeout(open, 1100);
	}
	function open() { clearTimeout(t); el.classList.add('open'); setTimeout(() => (el.style.display = 'none'), 1200); }
	el.onclick = open;
	document.getElementById('replay').onclick = play;
	document.addEventListener('keydown', () => el.classList.contains('show') && open());
	play();
})();
</script>
